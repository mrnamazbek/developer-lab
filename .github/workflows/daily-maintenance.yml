name: Daily maintenance

on:
  schedule:
    - cron: "17 09 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-status:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh the public AI attention signal
        run: python3 scripts/update_ai_pulse.py
      - name: Refresh the transparent maintenance status
        run: node scripts/daily-maintenance.mjs
      - name: Commit refreshed public signals
        run: |
          if git diff --quiet -- data/daily-status.json data/ai-pulse.json; then
            echo "No maintenance change is needed today."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-status.json data/ai-pulse.json
          git commit -m "chore: refresh lab signals [skip ci]"
          git push
